# The catalog robot (ARCHITECTURE §4.1, §4.3): once a day it counts the wines the users read, writes the public
# catalog's `CatalogWine` and publishes the `CatalogSnapshot` the app downloads. Nobody has to look after it: GitHub
# emails the repository owner when a run fails.
#
# Secrets (Settings → Secrets and variables → Actions), one key per CloudKit environment; an environment without
# its secrets is skipped:
#   CLOUDKIT_DEVELOPMENT_KEY_ID, CLOUDKIT_DEVELOPMENT_PRIVATE_KEY
#   CLOUDKIT_PRODUCTION_KEY_ID,  CLOUDKIT_PRODUCTION_PRIVATE_KEY
name: Catalog robot

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Count and print what would be written, without writing"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "Application/Data/UVVAWines.json"
      - "Application/Data/Localizations/pt-BR/catalog.json"
      - "Application/Robot/**"
      - "Application/Packages/Core/Sources/Core/**"
      - "Application/Packages/Core/Sources/Match/**"
      - "Application/Scripts/pack_content.py"

concurrency:
  group: catalog-robot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  robot:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: [development, production]
    steps:
      - uses: actions/checkout@v4

      - name: Check and pack the seed
        run: python3 Application/Scripts/pack_content.py --seed "$RUNNER_TEMP/seed.json"

      - name: Test the robot
        working-directory: Application/Robot
        env:
          CATALOG_SEED: ${{ runner.temp }}/seed.json
        run: swift test

      - name: Run the robot
        working-directory: Application/Robot
        env:
          CLOUDKIT_ENVIRONMENT: ${{ matrix.environment }}
          # Each environment only its own key: `a && b || c` would fall back to the development key when production
          # has none.
          DEVELOPMENT_KEY_ID: ${{ secrets.CLOUDKIT_DEVELOPMENT_KEY_ID }}
          DEVELOPMENT_PRIVATE_KEY: ${{ secrets.CLOUDKIT_DEVELOPMENT_PRIVATE_KEY }}
          PRODUCTION_KEY_ID: ${{ secrets.CLOUDKIT_PRODUCTION_KEY_ID }}
          PRODUCTION_PRIVATE_KEY: ${{ secrets.CLOUDKIT_PRODUCTION_PRIVATE_KEY }}
          CATALOG_SEED: ${{ runner.temp }}/seed.json
          ENABLE_CATALOG_PT_BR_PILOT: ${{ vars.ENABLE_CATALOG_PT_BR_PILOT }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ "$CLOUDKIT_ENVIRONMENT" = production ]; then
            export CLOUDKIT_KEY_ID="$PRODUCTION_KEY_ID" CLOUDKIT_PRIVATE_KEY="$PRODUCTION_PRIVATE_KEY"
          else
            export CLOUDKIT_KEY_ID="$DEVELOPMENT_KEY_ID" CLOUDKIT_PRIVATE_KEY="$DEVELOPMENT_PRIVATE_KEY"
          fi
          unset DEVELOPMENT_KEY_ID DEVELOPMENT_PRIVATE_KEY PRODUCTION_KEY_ID PRODUCTION_PRIVATE_KEY
          if [ -z "$CLOUDKIT_KEY_ID" ] || [ -z "$CLOUDKIT_PRIVATE_KEY" ]; then
            echo "No key for $CLOUDKIT_ENVIRONMENT: skipped."
            exit 0
          fi
          if [ "$CLOUDKIT_ENVIRONMENT" = development ] && [ "$ENABLE_CATALOG_PT_BR_PILOT" = true ]; then
            export CATALOG_TEXTS_PT_BR="$GITHUB_WORKSPACE/Application/Data/Localizations/pt-BR/catalog.json"
          fi
          swift run -c release catalog-robot $DRY_RUN
